{% extends "base.html" %}

{% block title %}Learning Goal Details{% endblock %}

{% block content %}
<a href="/students/{{ student_id }}/snapshots" class="btn btn-outline-primary mb-3">
    Terug naar snapshots
</a>
<h2>{{ learning_goal.title }}</h2>
<p>Student: {{ student.name }}</p>

<div class="card shadow-sm">
    <div class="card-body">
        <h4>Taxonomy Analysis</h4>
        <canvas id="taxonomyChart" height="120"></canvas>
    </div>
</div>
<script>
    window.studentId = "{{ student_id }}";
    window.learningGoalId = "{{ lg_id }}";
</script>

<script src="{{ url_for('static', filename='js/learning_goal_detail.js') }}"></script>
{% endblock %}
