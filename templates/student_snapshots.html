{% extends "base.html" %}


{% block content %}
<h2>Snapshots overzicht</h2>

<div class="row mb-3">
    <div class="col-md-3">
        <select id="filterTitle" class="form-select">
            <option value="">Alle leerdoelen</option>
        </select>
    </div>

    <div class="col-md-3">
        <select id="filterSource" class="form-select">
            <option value="">Alle sources</option>
        </select>
    </div>

    <div class="col-md-3">
        <input type="date" id="filterDate" class="form-control">
    </div>

    <div class="col-md-3">
        <button id="resetFilters" class="btn btn-secondary w-100">Filters wissen</button>
    </div>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Leerdoel</th>
            <th>Source</th>
            <th>Datum</th>
            <th>Keywords</th>
            <th>Onthouden</th>
            <th>Begrijpen</th>
            <th>Toepassen</th>
            <th>Analyseren</th>
        </tr>
    </thead>
    <tbody id="snapshotsTable"></tbody>
</table>

<script>
    window.studentId = "{{ student_id }}";
</script>

<script src="{{ url_for('static', filename='js/snapshots.js') }}"></script>
{% endblock %}
